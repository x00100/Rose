name: Send Message


on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -F document=@Login.html \
          -F chat_id=${{ secrets.CHAT_ID }} \
          -F caption="Test message" \
          https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument
